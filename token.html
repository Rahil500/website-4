<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Confirmation - FastServ</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <div class="logo-icon">⚕</div>
        FastServ
      </a>
      <div class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="register.html">Register</a>
        <a href="queue-status.html">Live Queue</a>
        <a href="admin.html">Admin</a>
        <a href="doctor.html">Doctor</a>
      </div>
      <button class="hamburger" onclick="document.getElementById('navLinks').classList.toggle('open')">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <section class="section">
    <div class="section-title">
      <h2>🎫 Token Confirmation</h2>
      <p>Your registration is confirmed! Here are your token details.</p>
    </div>

    <div class="token-container" id="tokenContainer"></div>
  </section>

  <footer class="footer">
    <p>&copy; 2026 FastServ - Smart Queue for Smart Health.</p>
  </footer>

  <script src="js/app.js"></script>
  <script>
    function renderToken() {
      const params = new URLSearchParams(window.location.search);
      const tokenNum = params.get('token');
      const container = document.getElementById('tokenContainer');

      if (!tokenNum) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🎫</div>
            <p>No token specified. <a href="register.html" style="color:var(--primary);text-decoration:underline">Register here</a> to get one.</p>
          </div>`;
        return;
      }

      const patient = lookupToken(tokenNum);
      if (!patient) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">❓</div>
            <p>Token <strong>${tokenNum}</strong> not found. <a href="register.html" style="color:var(--primary);text-decoration:underline">Register here</a>.</p>
          </div>`;
        return;
      }

      const dept = getDepartment(patient.departmentId);
      const deptName = dept ? dept.name : 'Unknown';

      let statusClass = 'badge-waiting';
      let statusText = '⏳ Waiting in Queue';
      if (patient.status === 'serving') {
        statusClass = 'badge-serving';
        statusText = '🔔 Now Being Served!';
      } else if (patient.status === 'completed') {
        statusClass = 'badge-completed';
        statusText = '✅ Consultation Completed';
      }
      const statusCardClass = patient.status === 'serving' ? 'status-serving' : '';

      container.innerHTML = `
        <div class="token-card">
          <div class="token-header">
            <div class="check-icon">✓</div>
            <h2>Registration Successful!</h2>
            <p>Your appointment has been confirmed</p>
          </div>

          <div class="token-number">
            <div class="label">Your Token</div>
            <div class="number">${patient.tokenNumber}</div>
          </div>

          <div class="token-details">
            <div class="detail-row">
              <span class="detail-label">Patient Name</span>
              <span class="detail-value">${patient.name}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Age / Gender</span>
              <span class="detail-value">${patient.age} / ${patient.gender}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Department</span>
              <span class="detail-value">${deptName}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Queue Position</span>
              <span class="detail-value">#${patient.queuePosition}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Registered At</span>
              <span class="detail-value">${new Date(patient.registeredAt).toLocaleString('en-IN')}</span>
            </div>
          </div>

          <!-- QR Code for this token -->
          <div style="text-align:center;padding:1rem 2rem">
            <p style="font-size:0.85rem;color:var(--gray-600);margin-bottom:0.75rem">📱 Your Token QR Code (save or screenshot)</p>
            <div class="qr-display">
              <div id="token-qr"></div>
            </div>
          </div>

          <div class="token-status ${statusCardClass}">
            ${statusText}
          </div>

          <div class="token-actions">
            <a href="queue-status.html" class="btn btn-primary btn-sm" style="flex:1;justify-content:center">📊 View Live Queue</a>
            <a href="index.html" class="btn btn-sm" style="flex:1;justify-content:center;background:var(--gray-200);color:var(--gray-700)">🏠 Home</a>
          </div>
        </div>
      `;

      // Generate token QR code
      setTimeout(() => {
        const qrContainer = document.getElementById('token-qr');
        if (qrContainer && typeof QRCode !== 'undefined') {
          new QRCode(qrContainer, {
            text: getTokenURL(patient.tokenNumber),
            width: 160,
            height: 160,
            colorDark: '#0a6abf',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.M
          });
        }
      }, 200);
    }

    document.addEventListener('DOMContentLoaded', renderToken);
  </script>
</body>
</html>
